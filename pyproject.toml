[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jmdict-stardict"
version = "1.0.0"
description = "Convert JMdict English XML to KOReader-optimized StarDict dictionaries."
readme = "spec.md"
requires-python = ">=3.11"
dependencies = ["lxml>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
jmdict-stardict = "jmdict_stardict.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true
